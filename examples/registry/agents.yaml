agents:
  - name: lead
    description: "Primary orchestrator"
    mode: primary
    class: big
    prompt:
      text: "You are the lead agent coordinating work across subagents."
    permissions:
      task: allow
      edit: deny
      write: deny
      bash:
        profile: lead
      external_directory:
        "*": ask
        "~/code/**": allow

  - name: build
    description: "Implements changes"
    mode: subagent
    class: default
    steps: 40
    prompt:
      text: "You implement code changes following TDD."
    permissions:
      task: deny
      edit: allow
      write: allow
      bash: deny
    mcp:
      - server: context7
        ask: ["resolve-library-id"]

  - name: plan
    description: "Architects changes before implementation"
    mode: subagent
    class: default
    compose_into_primary: true
    prompt:
      text: "You research and design an approach before code changes; you do not write or edit files yourself."
    permissions:
      task: deny
      edit: deny
      write: deny
      bash: deny
